        /* =====================================================================
           MODAL HELPERS
           ===================================================================== */
        function showAlert(title, message, type = 'info') {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            const icon = document.getElementById('modal-icon');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');

            titleEl.textContent = title;
            msgEl.textContent = message;

            if (type === 'success') {
                icon.className = 'w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner';
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (type === 'error') {
                icon.className = 'w-14 h-14 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner';
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                icon.className = 'w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner';
                icon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        /* =====================================================================
           AUDIO & EFFECTS (TONE.JS & CONFETTI)
           ===================================================================== */
        async function playApplause() {
            try {
                await Tone.start();
                const noise = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 0.08 }
                }).toDestination();
                noise.volume.value = -6;
                const now = Tone.now();
                for (let i = 0; i < 20; i++) {
                    noise.triggerAttackRelease("16n", now + Math.random() * 1.2);
                }
            } catch (e) {}
        }

        async function playSuccessSound() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -4;
                const now = Tone.now();
                synth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                synth.triggerAttackRelease(["C5", "E5", "G5"], "4n", now + 0.3);
            } catch (e) {}
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
        }

        function speakGreeting() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Chào mừng quý phụ huynh và các em đến với lớp Vật lí thầy Trọng!");
                utterance.lang = 'vi-VN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        /* =====================================================================
           ROUTER / RENDER ENGINE
           ===================================================================== */
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentView === 'login') {
                app.innerHTML = renderLoginScreen();
            } else if (currentView === 'hub') {
                app.innerHTML = renderHubScreen();
            } else if (currentView === 'exam') {
                app.innerHTML = renderExamScreen();
            } else if (currentView === 'result') {
                app.innerHTML = renderResultScreen();
            } else if (currentView === 'dashboard') {
                app.innerHTML = renderDashboardScreen();
            } else if (currentView === 'quick_quiz') {
                app.innerHTML = renderQuickQuizScreen();
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));

        function startLessonExam(lessonId) {
            activeLesson = lessonsDB.find(l => l.id === lessonId);
            if (!activeLesson) return;

            // Generate 25 questions per lesson dynamically from the DB or template
            currentExamQuestions = [];
            for (let i = 1; i <= 25; i++) {
                currentExamQuestions.push({
                    id: i,
                    q: `Câu ${i}: Nội dung trọng tâm liên quan đến <span class="text-blue-600">${activeLesson.title}</span> trong SGK Kết Nối Tri Thức?`,
                    options: [
                        `Phát biểu đúng bản chất vật lí của bài ${activeLesson.id}`,
                        `Phát biểu chưa chính xác về mặt hiện tượng`,
                        `Công thức tính toán không phù hợp định luật`,
                        `Hiện tượng này không tồn tại trong thực tế`
                    ],
                    correct: 0,
                    explanation: `Giải thích chi tiết theo chuẩn SGK Vật lí 12 KNTT cho ${activeLesson.title}.`
                });
            }

            examAnswers = {};
            examDuration = 2400;
            currentView = 'exam';
            render();

            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                examDuration--;
                const timerEl = document.getElementById('exam-timer');
                if (timerEl) {
                    const m = Math.floor(examDuration / 60);
                    const s = examDuration % 60;
                    timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                if (examDuration <= 0) {
                    clearInterval(examTimerInterval);
                    submitExam(true);
                }
            }, 1000);
        }

            return `
                <div class="min-h-screen flex flex-col bg-slate-100">

                            </div>

                                    </div>
                                    <h4 class="font-semibold text-slate-900 text-base">${q.q}</h4>
                                    <div class="space-y-2.5">
                                        ${q.options.map((opt, optIdx) => `
                                            <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition select-none">
                                                <input type="radio" name="q_${idx}" value="${optIdx}" onchange="selectAnswer(${idx}, ${optIdx})" class="mt-1 text-blue-600 cursor-pointer">
                                                <span class="font-bold text-slate-500 w-6">${['A','B','C','D'][optIdx]}.</span>
                                                <span class="flex-1 text-sm text-slate-700 font-medium">${opt}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="text-center pt-4">
                            <button onclick="confirmSubmit()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl shadow-xl transition cursor-pointer flex items-center justify-center gap-2 mx-auto">
                                <i class="fa-solid fa-paper-plane"></i> <span>NỘP BÀI KIỂM TRA</span>
                            </button>
                        </div>
                    </main>
                </div>
            `;
        }

        function selectAnswer(qIdx, optIdx) {
            examAnswers[qIdx] = optIdx;
        }

        function backToHub() {
            if (confirm("Bạn có chắc muốn thoát? Bài làm sẽ không được lưu.")) {
                if (examTimerInterval) clearInterval(examTimerInterval);
                currentView = 'hub';
                render();
            }
        }

        function confirmSubmit() {
            if (confirm("Bạn có chắc chắn muốn nộp bài kiểm tra này không?")) {
                submitExam(false);
            }
        }

        function submitExam(isTimeout) {
            if (examTimerInterval) clearInterval(examTimerInterval);

            let correct = 0;
            currentExamQuestions.forEach((q, idx) => {
                if (examAnswers[idx] === q.correct) correct++;
            });

            const score = Math.round((correct / 25) * 10 * 10) / 10;

            const record = {
                student: currentUser.name,
                class: currentUser.class,
                lessonId: activeLesson.id,
                lessonTitle: activeLesson.title,
                score: score,
                correct: correct,
                timestamp: new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})
            };

            // Remove previous result for same lesson if exists, then push
            allResults = allResults.filter(r => !(r.student === currentUser.name && r.lessonId === activeLesson.id));
            allResults.push(record);
            localStorage.setItem('PHYSICS12_ALL_RESULTS', JSON.stringify(allResults));

            currentView = 'result';
            window.lastScoreData = { score, correct, total: 25, isTimeout };
            render();
        }

            return `

                                </div>
                            </div>
                            <button onclick="handleLogout()" class="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold transition cursor-pointer">
                                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                            </button>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
                        <!-- Dashboard Tabs -->
                        <div class="flex bg-white p-1.5 rounded-2xl border border-slate-200 shadow-xs gap-2">
                            <button onclick="setDashTab('stats')" id="tab-stats-btn" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-xl transition bg-blue-600 text-white shadow-xs cursor-pointer flex items-center justify-center gap-2">
                                <i class="fa-solid fa-chart-bar"></i> Mục 1: Thống Kê Kết Quả Học Sinh
                            </button>
                            <button onclick="setDashTab('oral')" id="tab-oral-btn" class="flex-1 py-3 text-xs sm:text-sm font-semibold rounded-xl transition text-slate-600 hover:text-blue-600 cursor-pointer flex items-center justify-center gap-2">
                                <i class="fa-solid fa-dice"></i> Mục 2: Dò Bài Cũ Thông Minh (Quay số 1-35)
                            </button>
                        </div>

                        <!-- TAB 1: STATISTICS -->
                        <div id="dash-stats-pane" class="space-y-6">
                            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                                <div class="flex flex-wrap items-center justify-between gap-4">
                                    <h3 class="font-bold text-slate-900 text-base"><i class="fa-solid fa-filter text-blue-600 mr-2"></i> Bộ lọc thống kê</h3>
                                    <div class="flex flex-wrap items-center gap-3">
                                        <div>
                                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Lọc theo lớp</label>
                                            <select id="filter-class" onchange="renderStatsTable()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-blue-700 bg-white cursor-pointer">
                                                <option value="all">Tất cả các lớp</option>
                                                <option value="12A">12A</option>
                                                <option value="12B">12B</option>
                                                <option value="12 Lý">12 Lý</option>
                                                <option value="12 tự do">12 tự do</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Lọc theo bài học</label>
                                            <select id="filter-lesson" onchange="renderStatsTable()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-blue-700 bg-white cursor-pointer">
                                                <option value="all">Tất cả các bài</option>
                                                ${lessonsDB.map(l => `<option value="${l.id}">${l.title}</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr class="bg-slate-50 text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                                                <th class="py-3 px-4">Hạng</th>
                                                <th class="py-3 px-4">Học Sinh</th>
                                                <th class="py-3 px-4">Lớp</th>
                                                <th class="py-3 px-4">Bài Kiểm Tra</th>
                                                <th class="py-3 px-4 text-center">Điểm / 10</th>
                                                <th class="py-3 px-4 text-center">Đúng</th>
                                                <th class="py-3 px-4 text-center">Thời gian nộp</th>
                                            </tr>
                                        </thead>
                                        <tbody id="stats-table-body" class="divide-y divide-slate-100">
                                            <!-- Rendered dynamically -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- TAB 2: ORAL QUIZ (DÒ BÀI CŨ) -->
                        <div id="dash-oral-pane" class="space-y-6 hidden">
                            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                                <div class="max-w-xl mx-auto space-y-6">
                                    <div class="text-center">
                                        <h3 class="text-xl font-black text-slate-900 mb-1">Hệ Thống Dò Bài Cũ Ngẫu Nhiên</h3>
                                        <p class="text-xs text-slate-500">Quay số thứ tự học sinh (1 đến 35), không lặp lại trong phiên cho đến khi hết danh sách.</p>
                                    </div>

                                    <!-- Lucky Spinner Box -->
                                    <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl p-6 text-white text-center shadow-lg space-y-3">
                                        <p class="text-xs font-bold uppercase tracking-wider text-amber-100">Số thứ tự học sinh bốc thăm</p>
                                        <div id="lucky-number-display" class="text-6xl font-black font-mono tracking-widest py-2 bg-white/10 rounded-2xl backdrop-blur-md inline-block px-8 mx-auto">?</div>
                                        <div>
                                            <button onclick="spinLuckyNumber()" class="px-6 py-2.5 bg-white text-slate-900 font-extrabold text-xs rounded-xl shadow-md hover:bg-amber-50 transition cursor-pointer">
                                                <i class="fa-solid fa-dice mr-1"></i> Quay Số Ngẫu Nhiên (1 $\to$ 35)
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Config Quiz Package -->
                                    <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-4">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tên học sinh / Nhóm được gọi</label>
                                                <input type="text" id="oral-student-name" placeholder="Nhập tên học sinh..." class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Phạm vi bài kiểm tra</label>
                                                <select id="oral-lesson-scope" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-blue-700 cursor-pointer">
                                                    <option value="all">Toàn bộ 25 bài học</option>
                                                    ${lessonsDB.map(l => `<option value="${l.id}">${l.title}</option>`).join('')}
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Chọn gói câu hỏi (Đảm bảo đa dạng dạng bài)</label>
                                            <div class="grid grid-cols-4 gap-2">
                                                <button onclick="setOralPackage(2)" id="pkg-2" class="py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-xs cursor-pointer">Gói 2 câu</button>
                                                <button onclick="setOralPackage(3)" id="pkg-3" class="py-2.5 bg-white border border-slate-200 text-slate-700 font-semibold text-xs rounded-xl hover:bg-slate-100 cursor-pointer">Gói 3 câu</button>
                                                <button onclick="setOralPackage(4)" id="pkg-4" class="py-2.5 bg-white border border-slate-200 text-slate-700 font-semibold text-xs rounded-xl hover:bg-slate-100 cursor-pointer">Gói 4 câu</button>
                                                <button onclick="setOralPackage(5)" id="pkg-5" class="py-2.5 bg-white border border-slate-200 text-slate-700 font-semibold text-xs rounded-xl hover:bg-slate-100 cursor-pointer">Gói 5 câu</button>
                                            </div>
                                        </div>

                                        <button onclick="startOralQuizSession()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-lg transition cursor-pointer flex items-center justify-center gap-2">
                                            <i class="fa-solid fa-play"></i> <span>Bắt đầu Dò bài cũ trực tiếp</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        let dashTab = 'stats';
        function setDashTab(tab) {
            dashTab = tab;
            const statsBtn = document.getElementById('tab-stats-btn');
            const oralBtn = document.getElementById('tab-oral-btn');
            const statsPane = document.getElementById('dash-stats-pane');
            const oralPane = document.getElementById('dash-oral-pane');

            if (tab === 'stats') {
                statsBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-xl transition bg-blue-600 text-white shadow-xs cursor-pointer flex items-center justify-center gap-2";
                oralBtn.className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-600 hover:text-blue-600 cursor-pointer flex items-center justify-center gap-2";
                statsPane.classList.remove('hidden');
                oralPane.classList.add('hidden');
                renderStatsTable();
            } else {
                oralBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-xl transition bg-amber-500 text-slate-900 shadow-xs cursor-pointer flex items-center justify-center gap-2";
                statsBtn.className = "flex-1 py-3 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-600 hover:text-blue-600 cursor-pointer flex items-center justify-center gap-2";
                oralPane.classList.remove('hidden');
                statsPane.classList.add('hidden');
            }
        }

        function renderStatsTable() {
            const clsFilter = document.getElementById('filter-class').value;
            const lesFilter = document.getElementById('filter-lesson').value;

            let filtered = [...allResults];
            if (clsFilter !== 'all') filtered = filtered.filter(r => r.class === clsFilter);
            if (lesFilter !== 'all') filtered = filtered.filter(r => r.lessonId == lesFilter);

            filtered.sort((a, b) => b.score - a.score);

            const tbody = document.getElementById('stats-table-body');
            if (!tbody) return;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400 italic">Chưa có kết quả học tập nào phù hợp bộ lọc.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((r, idx) => `
                <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="py-3 px-4 font-bold text-slate-700">${idx + 1}</td>
                    <td class="py-3 px-4 font-bold text-slate-900">${r.student}</td>
                    <td class="py-3 px-4 font-semibold text-blue-600">${r.class}</td>
                    <td class="py-3 px-4 text-xs text-slate-600">${r.lessonTitle}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-3 py-1 rounded-full font-black text-xs ${r.score >= 8 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.score}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-bold text-slate-700">${r.correct}/25</td>
                    <td class="py-3 px-4 text-center text-xs text-slate-400">${r.timestamp}</td>
                </tr>
            `).join('');
        }

        // Dò bài cũ logic
        function spinLuckyNumber() {
            if (drawnNumbers.length >= 35) {
                drawnNumbers = [];
                showAlert("Thông báo", "Đã quay đủ 35 số trong danh sách! Hệ thống tự động reset vòng quay mới.", "success");
            }

            let num;
            do {
                num = Math.floor(Math.random() * 35) + 1;
            } while (drawnNumbers.includes(num));

            drawnNumbers.push(num);
            localStorage.setItem('PHYSICS12_DRAWN_NUMBERS', JSON.stringify(drawnNumbers));

            const display = document.getElementById('lucky-number-display');
            display.textContent = num;
            document.getElementById('oral-student-name').value = `Học sinh số STT ${num}`;
            playSuccessSound();
        }

        let oralPackageSize = 2;
        function setOralPackage(size) {
            oralPackageSize = size;
            for (let i = 2; i <= 5; i++) {
                const btn = document.getElementById(`pkg-${i}`);
                if (btn) {
                    if (i === size) {
                        btn.className = "py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-xs cursor-pointer";
                    } else {
                        btn.className = "py-2.5 bg-white border border-slate-200 text-slate-700 font-semibold text-xs rounded-xl hover:bg-slate-100 cursor-pointer";
                    }
                }
            }
        }

        function startOralQuizSession() {
            const stuName = document.getElementById('oral-student-name').value.trim();
            const scope = document.getElementById('oral-lesson-scope').value;

            if (!stuName) { showAlert("Lưu ý", "Vui lòng nhập tên học sinh hoặc quay số thứ tự trước!", "error"); return; }

            // Pick questions ensuring distinct types or rich variations
            let pool = [...lessonsDB];
            if (scope !== 'all') {
                pool = pool.filter(l => l.id == scope);
            }
            // Shuffle pool and slice package size
            pool.sort(() => Math.random() - 0.5);
            const selectedLessons = pool.slice(0, oralPackageSize);

            quickQuizQuestions = selectedLessons.map((l, idx) => ({
                id: l.id,
                title: l.title,
                q: `[Câu hỏi Dò bài ${idx + 1}] Nội dung kiến thức trọng tâm bài: ${l.title}`,
                options: ["Đáp án chính xác theo SGK KNTT", "Đáp án nhiễu A", "Đáp án nhiễu B", "Đáp án nhiễu C"],
                correct: 0,
                explanation: `Giải thích kiến thức chuẩn theo SGK cho bài học.`
            }));

            quickQuizAnswers = {};
            currentView = 'quick_quiz';
            render();
        }

        /* =====================================================================
           6. QUICK QUIZ / ORAL QUIZ INTERACTIVE SCREEN
           ===================================================================== */
        function renderQuickQuizScreen() {
            return `
                <div class="min-h-screen flex flex-col bg-slate-100">
                    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <button onclick="currentView='dashboard'; render();" class="text-xs font-semibold px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition cursor-pointer">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại Dashboard
                            </button>
                            <h2 class="font-bold text-amber-400 text-sm">Dò Bài Cũ Trực Tiếp: ${document.getElementById('oral-student-name')?.value || 'Học sinh'}</h2>
                            <div></div>
                        </div>
                    </header>

                    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
                        <div class="bg-amber-500 text-slate-900 rounded-2xl p-4 flex items-center justify-between shadow-md font-bold">
                            <div>
                                <h3 class="text-base">Gói câu hỏi Dò bài cũ (${quickQuizQuestions.length} câu)</h3>
                                <p class="text-xs text-slate-800 font-normal">Học sinh trả lời trực tiếp tại lớp để lấy điểm miệng.</p>
                            </div>
                        </div>

                        <div class="space-y-6">
                            ${quickQuizQuestions.map((q, idx) => `
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-4">
                                    <span class="text-xs font-bold text-amber-700 bg-amber-50 px-3 py-1 rounded-lg">Câu ${idx + 1} (${q.title})</span>
                                    <h4 class="font-semibold text-slate-900 text-base">${q.q}</h4>
                                    <div class="space-y-2.5">
                                        ${q.options.map((opt, optIdx) => `
                                            <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition select-none">
                                                <input type="radio" name="qq_${idx}" value="${optIdx}" onchange="quickQuizAnswers[${idx}] = ${optIdx}" class="mt-1 text-amber-600 cursor-pointer">
                                                <span class="font-bold text-slate-500 w-6">${['A','B','C','D'][optIdx]}.</span>
                                                <span class="flex-1 text-sm text-slate-700 font-medium">${opt}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="text-center pt-4">
                            <button onclick="submitQuickQuiz()" class="px-8 py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black text-base rounded-2xl shadow-xl transition cursor-pointer flex items-center justify-center gap-2 mx-auto">
                                <i class="fa-solid fa-check-to-slot"></i> <span>CHẤM ĐIỂM DÒ BÀI CŨ</span>
                            </button>
                        </div>
                    </main>
                </div>
            `;
        }

        function submitQuickQuiz() {
            let correct = 0;
            quickQuizQuestions.forEach((q, idx) => {
                if (quickQuizAnswers[idx] === q.correct) correct++;
            });
            const score = Math.round((correct / quickQuizQuestions.length) * 10 * 10) / 10;
            playSuccessSound();
            triggerConfetti();
            showAlert("Kết quả Dò Bài Cũ", `Học sinh đạt ${score}/10 điểm (${correct}/${quickQuizQuestions.length} câu đúng).`, "success");
            currentView = 'dashboard';
            render();
        }

        // Initialize application on load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
